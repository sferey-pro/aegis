name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    # Toute l'application vit dans app_build/ ; il n'y a pas de package.json
    # à la racine du dépôt. S'applique aux étapes `run`, pas aux `uses`.
    defaults:
      run:
        working-directory: app_build

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
          
      - name: Install dependencies
        run: bun install
        
      - name: Lint and Format (Biome)
        run: bunx biome ci .
        
      - name: Typecheck
        run: bun run typecheck
        
      - name: Run tests
        # `bun run test` enchaîne les deux étages : composants (avec DOM) puis
        # fonctionnel (sans DOM). happy-dom remplace la classe globale Response,
        # ce qui empêche `Bun.serve` de démarrer, d'où la séparation.
        run: bun run test
